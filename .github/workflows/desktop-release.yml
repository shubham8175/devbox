# Builds the Tauri desktop installers and publishes them as a GitHub Release.
# Trigger: push a tag like v0.2.0 (after bumping "version" in package.json,
# which tauri.conf.json reads), or run it manually from the Actions tab.
#
# Exactly two files are published, with fixed names, so the homepage
# "Download for macOS / Windows" pill (src/lib/site.ts) can point straight at
#   https://github.com/shubham8175/devbox/releases/latest/download/DevBox-macOS.dmg
#   https://github.com/shubham8175/devbox/releases/latest/download/DevBox-Windows-Setup.exe
# The macOS build is a universal binary (Apple Silicon + Intel) so one .dmg
# serves every Mac. The release is published immediately (not a draft).
name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            asset: DevBox-macOS.dmg
            bundle_glob: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: ""
            asset: DevBox-Windows-Setup.exe
            bundle_glob: src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build installer
        run: npm run desktop:build -- ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
        env:
          # Ad-hoc sign the whole macOS bundle so Gatekeeper sees a usable
          # signature (Info.plist bound, correct identifier) instead of the
          # bare linker signature. Notarization still needs an Apple ID.
          APPLE_SIGNING_IDENTITY: "-"
      - name: Rename installer to its fixed download name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-installer
          files=( ${{ matrix.bundle_glob }} )
          if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
            echo "Expected exactly one installer, found: ${files[*]}" >&2
            exit 1
          fi
          mv "${files[0]}" "dist-installer/${{ matrix.asset }}"
          ls -la dist-installer
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist-installer/${{ matrix.asset }}
          if-no-files-found: error

  # Publishes once, after BOTH installers exist, so the "latest" release never
  # goes live with a file missing.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: ls -la installers
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
          name: DevBox ${{ github.ref_type == 'tag' && github.ref_name || format('manual build {0}', github.run_number) }}
          body: |
            Desktop app installers.

            - **macOS** (Apple Silicon and Intel): `DevBox-macOS.dmg`
            - **Windows** 10/11: `DevBox-Windows-Setup.exe`
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            installers/DevBox-macOS.dmg
            installers/DevBox-Windows-Setup.exe
