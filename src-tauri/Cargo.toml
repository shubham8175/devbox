[package]
name = "devbox"
version = "0.1.0"
description = "Developer tools that run in your browser."
authors = ["Shubham"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "devbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
# Opens external links and deep links in the system browser / handler. Used
# only from Rust, so nothing is exposed to the webview and no capability is needed.
open = "5"

# Only to flip WKWebView's `allowsBackForwardNavigationGestures`, which wry
# leaves off; the same crate version wry already links, so nothing new is built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3.2", features = ["WKWebView"] }
